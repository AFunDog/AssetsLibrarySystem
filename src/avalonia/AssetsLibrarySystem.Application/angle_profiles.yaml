# 素材子类型与角度配置
# 每个 type → subtype 定义了该子类型的角度组合
# 角度可以用简写（仅 key）或完整定义（key + label + prompt + max_length）
# 简写时从定义段继承完整属性

# ========== 角度定义（供简写引用） ==========
angle_definitions:
  整体:
    label: 整体概述
    prompt: 用一句话概括素材中从开始到结束发生的主要内容，不得省略改变事件含义的关键瞬间
    max_length: 120
  时间线:
    label: 时间线
    prompt: |
      按时间顺序描述素材中的主要画面和事件。
      使用"相对时间：内容"的格式，例如：
      "00:00.0-00:01.2：角色站在门口；00:01.2-00:02.0：画面闪白切换到室外。"
      必须检查开头和结尾的瞬时画面。
    max_length: 300
  人物:
    label: 人物主体
    prompt: |
      描述画面中出现的人物或主要主体，包括可见外观、发色、服装、表情和相对位置。
      不确定人物身份时不得猜测姓名。
    max_length: 160
  场景:
    label: 场景环境
    prompt: |
      描述实际可见的地点、环境、时间氛围、背景物体和场景变化。
      如果素材中发生场景切换，应按出现顺序说明。
    max_length: 140
  动作:
    label: 动作事件
    prompt: |
      按发生顺序描述人物动作、物体运动、交互行为和显著动态变化。
      区分持续动作与一闪而过的瞬时动作。
    max_length: 180
  情感:
    label: 情绪氛围
    prompt: |
      根据人物表情、动作和画面表现，描述能够明确判断的情绪及氛围变化。
      无法可靠判断时输出空值。
    max_length: 100
  镜头:
    label: 镜头语言
    prompt: |
      描述景别、视角、构图、镜头运动、画面切换和剪辑节奏。
      特别记录特写、快速切换、闪回、插入镜头、黑场和闪白。
      不要在镜头字段中重复人物动作。
    max_length: 140
  关键画面:
    label: 关键画面
    prompt: |
      记录适合作为检索定位点的显著画面，包括人物首次出现、表情特写、
      重要动作、物品特写、场景突变、短暂插入画面和一闪而过的画面。
      尽可能标明相对时间。
    max_length: 180
  视觉风格:
    label: 视觉风格
    prompt: |
      描述素材明确呈现的美术形式、色彩倾向、光影、线条和画面质感。
      不要仅根据单个模糊画面推断具体作品。
    max_length: 120
  游戏类型:
    label: 游戏类型
    prompt: 根据画面中的界面、UI、视角和玩法特征，判断可能的游戏类型和风格。无法判断时输出空值
    max_length: 80
  歌词大意:
    label: 歌词大意
    prompt: 分析歌词主题和情感表达
    max_length: 150
  曲风:
    label: 曲风
    prompt: 描述音乐风格和流派
    max_length: 80
  乐器:
    label: 乐器
    prompt: 列出主要使用的乐器或声音元素
    max_length: 80
  风格:
    label: 风格
    prompt: 描述速度、节奏、编曲类型和声音质感
    max_length: 80
  声音描述:
    label: 声音描述
    prompt: 描述声音的特征和质感
    max_length: 100
  使用场景:
    label: 使用场景
    prompt: 根据声音特征判断素材适合用在什么场景，无法判断时输出空值
    max_length: 80

# ========== 音频子类型 ==========
音频:
  歌曲:
    label: 歌曲
    angles:
      - 歌词大意
      - 曲风
      - 情感
      - 乐器
      - 整体
  纯音乐:
    label: 纯音乐/伴奏
    angles:
      - 曲风
      - 情感
      - 乐器
      - 整体
  音效:
    label: 音效
    angles:
      - 声音描述
      - 使用场景
      - 整体
  默认:
    label: 通用音频
    angles:
      - 整体
      - 乐器
      - 风格
      - 情感

# ========== 视频子类型 ==========
视频:
  实拍:
    label: 实拍视频
    angles:
      - 时间线
      - 场景
      - 动作
      - 镜头
      - 整体
    slicing:
      enabled: true
      slice_threshold: 60
      min_scene_len: 15
      adaptive_threshold: 3.0
  动画:
    label: 动画/CG
    angles:
      - 时间线
      - 人物
      - 场景
      - 动作
      - 情感
      - 镜头
      - 关键画面
      - 整体
    slicing:
      enabled: true
      slice_threshold: 30
      min_scene_len: 15
      adaptive_threshold: 3.0
  游戏录制:
    label: 游戏录制
    angles:
      - 时间线
      - 游戏类型
      - 场景
      - 动作
      - 整体
    slicing:
      enabled: true
      slice_threshold: 60
      min_scene_len: 15
      adaptive_threshold: 3.0
  默认:
    label: 通用视频
    angles:
      - 时间线
      - 整体

# ========== 视频剪辑子类型（片段级描述与检索） ==========
# 剪辑库中的视频按片段模式处理：先分割确认时间点，再逐片段结构化描述
视频剪辑:
  实拍:
    label: 实拍剪辑
    angles:
      - 时间线
      - 场景
      - 动作
      - 镜头
      - 整体
    slicing:
      enabled: true
      slice_threshold: 0
      min_scene_len: 15
      adaptive_threshold: 3.0
  动画:
    label: 动画剪辑
    angles:
      - 时间线
      - 人物
      - 场景
      - 动作
      - 情感
      - 镜头
      - 关键画面
      - 整体
    slicing:
      enabled: true
      slice_threshold: 0
      min_scene_len: 15
      adaptive_threshold: 3.0
  游戏录制:
    label: 游戏录制剪辑
    angles:
      - 时间线
      - 游戏类型
      - 场景
      - 动作
      - 整体
    slicing:
      enabled: true
      slice_threshold: 0
      min_scene_len: 15
      adaptive_threshold: 3.0
  默认:
    label: 通用剪辑
    angles:
      - 整体
      - 场景
      - 动作
      - 镜头
    slicing:
      enabled: true
      slice_threshold: 0
      min_scene_len: 15
      adaptive_threshold: 3.0

# ========== 图片子类型 ==========
图片:
  插画:
    label: 插画/手绘
    angles:
      - 视觉风格
      - 场景
      - 整体
  照片:
    label: 照片/实拍
    angles:
      - 场景
      - 整体
  默认:
    label: 通用图片
    angles:
      - 整体

# ========== 文本子类型 ==========
文本:
  默认:
    label: 通用文本
    angles:
      - 整体